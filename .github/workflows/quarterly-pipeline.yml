name: Quarterly Pipeline

on:
  workflow_dispatch:
  schedule:
    # 20th of Feb/May/Aug/Nov at 05:00 and 04:00 UTC to cover DST transitions for Europe/Kyiv.
    - cron: "0 4 20 2,5,8,11 *"
    - cron: "0 5 20 2,5,8,11 *"

permissions:
  contents: write

concurrency:
  group: quarterly-pipeline
  cancel-in-progress: false

jobs:
  run-quarterly-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Schedule gate (20th day, 07:00 Europe/Kyiv)
        id: schedule_gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual trigger detected; running workflow."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          kyiv_time="$(TZ=Europe/Kyiv date '+%Y-%m-%d %H:%M:%S %Z')"
          kyiv_day="$(TZ=Europe/Kyiv date '+%d')"
          kyiv_hour="$(TZ=Europe/Kyiv date '+%H')"
          echo "Current Kyiv time: ${kyiv_time}"

          if [ "${kyiv_day}" = "20" ] && [ "${kyiv_hour}" = "07" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "In target window; continuing."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Outside target window; skipping scheduled run."
          fi

      - name: Checkout
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required configuration
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "Missing required secret: SEC_USER_AGENT"
            exit 1
          fi

      - name: Run tests
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: |
          python -m pytest -q

      - name: Run quarterly pipeline
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_PER_SEC: ${{ vars.SEC_RATE_LIMIT_PER_SEC || '5' }}
          MANAGERS_FILE: config/managers.json
          DB_PATH: data/tracker.sqlite3
          NOTIFIERS: ""
          PIPELINE_REPORT_DIR: reports/quarterly
          SYMBOL_METADATA_FILE: config/symbol_metadata.json
          TREND_LIVE_PRICES_SYMBOLS_FILE: config/cusip_tickers.json
        run: |
          mkdir -p data
          python -m tracker --run-quarterly-pipeline

      - name: Upload quarterly reports
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-reports
          path: reports/quarterly/
          if-no-files-found: warn

      - name: Commit state file if changed
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/tracker.sqlite3
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update quarterly pipeline state [skip ci]"
          target_branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${target_branch}"; then
              echo "Pushed state update to ${target_branch}."
              exit 0
            fi
            echo "Push failed on attempt ${attempt}. Rebasing onto origin/${target_branch}..."
            git fetch origin "${target_branch}"
            if ! git rebase "origin/${target_branch}"; then
              git rebase --abort || true
              echo "Rebase conflict while updating tracker state."
              exit 1
            fi
          done
          echo "Failed to push state update after retries."
          exit 1
