name: Signals

on:
  workflow_dispatch:
    inputs:
      force_full_rebuild_and_resend:
        description: "Force full data rebuild and then force resend trend summary"
        required: false
        default: false
        type: boolean
      force_resend_only:
        description: "Force resend trend summary from existing DB data only"
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub Actions schedule is UTC.
    # 04:17 UTC matches 07:17 Europe/Kyiv during DST (UTC+3).
    - cron: "17 4 * * *"
    # 05:17 UTC matches 07:17 Europe/Kyiv during standard time (UTC+2).
    - cron: "17 5 * * *"
    # 16:17 UTC matches 19:17 Europe/Kyiv during DST (UTC+3).
    - cron: "17 16 * * *"
    # 17:17 UTC matches 19:17 Europe/Kyiv during standard time (UTC+2).
    - cron: "17 17 * * *"

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Schedule gate (Kyiv DST schedule selection)
        id: schedule_gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual trigger detected; running workflow."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          kyiv_time="$(TZ=Europe/Kyiv date '+%Y-%m-%d %H:%M:%S %Z')"
          kyiv_offset="$(TZ=Europe/Kyiv date '+%z')"
          trigger_schedule="${{ github.event.schedule }}"
          echo "Current Kyiv time: ${kyiv_time}"
          echo "Kyiv UTC offset: ${kyiv_offset}"
          echo "Trigger schedule: ${trigger_schedule}"

          case "${kyiv_offset}:${trigger_schedule}" in
            "+0300:17 4 * * *"|"+0300:17 16 * * *"|"+0200:17 5 * * *"|"+0200:17 17 * * *")
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "Schedule matches current Kyiv offset; continuing."
              ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping duplicate scheduled run for the inactive Kyiv offset."
              ;;
          esac

      - name: Checkout
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize CI diagnostics
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts
          {
            echo "workflow=${{ github.workflow }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_number=${{ github.run_number }}"
            echo "attempt=${{ github.run_attempt }}"
            echo "event=${{ github.event_name }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "started_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > ci_artifacts/run_context.txt

      - name: Install dependencies
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          {
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          } 2>&1 | tee ci_artifacts/install_dependencies.log

      - name: Validate required configuration
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NOTIFIERS: ${{ vars.NOTIFIERS || 'telegram' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          {
            if [ -z "$SEC_USER_AGENT" ]; then
              echo "Missing required secret: SEC_USER_AGENT"
              exit 1
            fi
            if [[ ",$NOTIFIERS," == *,telegram,* ]]; then
              if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
                echo "Missing required secret for telegram notifier: TELEGRAM_BOT_TOKEN"
                exit 1
              fi
              if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
                echo "Missing required secret for telegram notifier: TELEGRAM_CHAT_ID"
                exit 1
              fi
            fi
          } 2>&1 | tee ci_artifacts/validate_config.log

      - name: Run tests
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          python -m pytest -q 2>&1 | tee ci_artifacts/pytest.log

      - name: Validate manual force flags
        if: steps.schedule_gate.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          {
            if [ "${{ github.event.inputs.force_full_rebuild_and_resend }}" = "true" ] && [ "${{ github.event.inputs.force_resend_only }}" = "true" ]; then
              echo "Choose only one mode: force_full_rebuild_and_resend OR force_resend_only"
              exit 1
            fi
          } 2>&1 | tee ci_artifacts/validate_force_flags.log

      - name: Run signals
        if: steps.schedule_gate.outputs.should_run == 'true' && !(github.event_name == 'workflow_dispatch' && (github.event.inputs.force_full_rebuild_and_resend == 'true' || github.event.inputs.force_resend_only == 'true'))
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_PER_SEC: ${{ vars.SEC_RATE_LIMIT_PER_SEC || '5' }}
          MANAGERS_FILE: config/managers.json
          DB_PATH: data/signals.sqlite3
          NOTIFIERS: ${{ vars.NOTIFIERS || 'telegram' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          {
            mkdir -p data
            python -m signals
          } 2>&1 | tee ci_artifacts/run_signals.log

      - name: Force full rebuild and resend (manual)
        if: steps.schedule_gate.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.force_full_rebuild_and_resend == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_PER_SEC: ${{ vars.SEC_RATE_LIMIT_PER_SEC || '5' }}
          MANAGERS_FILE: config/managers.json
          DB_PATH: data/signals.sqlite3
          NOTIFIERS: ${{ vars.NOTIFIERS || 'telegram' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          mkdir -p data
          python -m signals --force-trend-recompute 2>&1 | tee ci_artifacts/force_recompute.log
          python -m signals --send-trend-summary-from-db --send-trend-summary-force 2>&1 | tee ci_artifacts/force_resend_after_recompute.log

      - name: Force resend trend summary only (manual)
        if: steps.schedule_gate.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.force_resend_only == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_PER_SEC: ${{ vars.SEC_RATE_LIMIT_PER_SEC || '5' }}
          MANAGERS_FILE: config/managers.json
          DB_PATH: data/signals.sqlite3
          NOTIFIERS: ${{ vars.NOTIFIERS || 'telegram' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python -m signals --send-trend-summary-from-db --send-trend-summary-force 2>&1 | tee ci_artifacts/force_resend_only.log

      - name: Commit state file if changed
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/signals.sqlite3
            if git diff --staged --quiet; then
              echo "No state changes to commit."
              exit 0
            fi
            git commit -m "chore: update signals state [skip ci]"
            target_branch="${GITHUB_REF_NAME:-main}"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${target_branch}"; then
                echo "Pushed state update to ${target_branch}."
                exit 0
              fi
              echo "Push failed on attempt ${attempt}. Rebasing onto origin/${target_branch}..."
              git fetch origin "${target_branch}"
              if ! git rebase "origin/${target_branch}"; then
                git rebase --abort || true
                echo "Rebase conflict while updating signals state."
                exit 1
              fi
            done
            echo "Failed to push state update after retries."
            exit 1
          } 2>&1 | tee ci_artifacts/commit_state.log

      - name: Upload CI diagnostics artifact
        if: always() && steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signals-diagnostics-${{ github.run_id }}
          path: |
            ci_artifacts/**
          if-no-files-found: warn
          retention-days: 14

      - name: Publish diagnostics summary
        if: always() && steps.schedule_gate.outputs.should_run == 'true'
        run: |
          {
            echo "### Signals Diagnostics"
            echo "- Artifact: \`signals-diagnostics-${{ github.run_id }}\`"
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Ref: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- UTC finished: \`$(date -u '+%Y-%m-%dT%H:%M:%SZ')\`"
          } >> "$GITHUB_STEP_SUMMARY"
