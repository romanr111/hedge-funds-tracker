name: 13F Tracker

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes (UTC).
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: 13f-tracker
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required configuration
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NOTIFIERS: ${{ vars.NOTIFIERS || 'telegram' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "Missing required secret: SEC_USER_AGENT"
            exit 1
          fi
          if [[ ",$NOTIFIERS," == *,telegram,* ]]; then
            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
              echo "Missing required secret for telegram notifier: TELEGRAM_BOT_TOKEN"
              exit 1
            fi
            if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
              echo "Missing required secret for telegram notifier: TELEGRAM_CHAT_ID"
              exit 1
            fi
          fi

      - name: Run tracker
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_PER_SEC: ${{ vars.SEC_RATE_LIMIT_PER_SEC || '5' }}
          MANAGERS_FILE: config/managers.json
          DB_PATH: data/tracker.sqlite3
          NOTIFIERS: ${{ vars.NOTIFIERS || 'telegram' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          mkdir -p data
          python -m tracker

      - name: Commit state file if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/tracker.sqlite3
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update tracker state [skip ci]"
          target_branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${target_branch}"; then
              echo "Pushed state update to ${target_branch}."
              exit 0
            fi
            echo "Push failed on attempt ${attempt}. Rebasing onto origin/${target_branch}..."
            git fetch origin "${target_branch}"
            if ! git rebase "origin/${target_branch}"; then
              git rebase --abort || true
              echo "Rebase conflict while updating tracker state."
              exit 1
            fi
          done
          echo "Failed to push state update after retries."
          exit 1
